<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PWA 诊断工具</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: system-ui, -apple-system, sans-serif;
            background: #0f0f1a;
            color: #fff;
            padding: 20px;
            line-height: 1.6;
        }
        .container { max-width: 600px; margin: 0 auto; }
        h1 { margin-bottom: 20px; color: #8b5cf6; }
        .section {
            background: rgba(255,255,255,0.05);
            border-radius: 12px;
            padding: 16px;
            margin-bottom: 16px;
        }
        .section h2 {
            font-size: 16px;
            margin-bottom: 12px;
            color: #a78bfa;
        }
        .item {
            display: flex;
            justify-content: space-between;
            padding: 8px 0;
            border-bottom: 1px solid rgba(255,255,255,0.1);
        }
        .item:last-child { border-bottom: none; }
        .label { color: #9ca3af; }
        .value { font-weight: 600; }
        .success { color: #10b981; }
        .error { color: #ef4444; }
        .warning { color: #f59e0b; }
        .code {
            background: rgba(0,0,0,0.3);
            padding: 12px;
            border-radius: 8px;
            font-family: monospace;
            font-size: 12px;
            overflow-x: auto;
            margin-top: 8px;
        }
        button {
            width: 100%;
            padding: 12px;
            background: linear-gradient(135deg, #8b5cf6, #3b82f6);
            border: none;
            border-radius: 8px;
            color: white;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            margin-top: 12px;
        }
        button:active { transform: scale(0.98); }
    </style>
</head>
<body>
    <div class="container">
        <h1>🔍 PWA 诊断工具</h1>
        
        <div class="section">
            <h2>环境检测</h2>
            <div id="environment"></div>
        </div>

        <div class="section">
            <h2>Service Worker</h2>
            <div id="serviceWorker"></div>
        </div>

        <div class="section">
            <h2>Manifest</h2>
            <div id="manifest"></div>
        </div>

        <div class="section">
            <h2>PWA 安装</h2>
            <div id="install"></div>
            <button id="installBtn" style="display:none;">立即安装</button>
        </div>

        <div class="section">
            <h2>控制台日志</h2>
            <div class="code" id="logs"></div>
        </div>
    </div>

    <script>
        const logs = [];
        const logEl = document.getElementById('logs');

        function log(msg, type = 'info') {
            const timestamp = new Date().toLocaleTimeString();
            logs.push(`[${timestamp}] ${msg}`);
            logEl.textContent = logs.join('\n');
            console.log(msg);
        }

        function addItem(container, label, value, status) {
            const item = document.createElement('div');
            item.className = 'item';
            item.innerHTML = `
                <span class="label">${label}</span>
                <span class="value ${status}">${value}</span>
            `;
            container.appendChild(item);
        }

        // 环境检测
        const envEl = document.getElementById('environment');
        addItem(envEl, 'User Agent', navigator.userAgent.match(/\(([^)]+)\)/)?.[1] || 'Unknown');
        addItem(envEl, 'Protocol', window.location.protocol, window.location.protocol === 'https:' ? 'success' : 'error');
        addItem(envEl, 'Host', window.location.host);
        addItem(envEl, 'Secure Context', isSecureContext ? '✓ 是' : '✗ 否', isSecureContext ? 'success' : 'error');
        addItem(envEl, 'Service Worker 支持', 'serviceWorker' in navigator ? '✓ 支持' : '✗ 不支持', 'serviceWorker' in navigator ? 'success' : 'error');
        addItem(envEl, 'Standalone 模式', window.matchMedia('(display-mode: standalone)').matches ? '✓ 是' : '✗ 否');

        // Service Worker 检测
        const swEl = document.getElementById('serviceWorker');
        if ('serviceWorker' in navigator) {
            log('开始检测 Service Worker...');
            
            navigator.serviceWorker.getRegistration()
                .then(reg => {
                    if (reg) {
                        addItem(swEl, '注册状态', '✓ 已注册', 'success');
                        addItem(swEl, 'Scope', reg.scope);
                        addItem(swEl, 'State', reg.active ? reg.active.state : '未激活', reg.active ? 'success' : 'warning');
                        log('Service Worker 已注册: ' + reg.scope);
                    } else {
                        addItem(swEl, '注册状态', '✗ 未注册', 'error');
                        log('Service Worker 未注册，尝试注册...');
                        
                        navigator.serviceWorker.register('/service-worker.js')
                            .then(r => {
                                log('Service Worker 注册成功: ' + r.scope);
                                location.reload();
                            })
                            .catch(e => {
                                log('Service Worker 注册失败: ' + e.message, 'error');
                                addItem(swEl, '错误', e.message, 'error');
                            });
                    }
                })
                .catch(e => {
                    addItem(swEl, '错误', e.message, 'error');
                    log('Service Worker 检测失败: ' + e.message, 'error');
                });
        } else {
            addItem(swEl, '状态', '✗ 浏览器不支持', 'error');
            log('浏览器不支持 Service Worker', 'error');
        }

        // Manifest 检测
        const manifestEl = document.getElementById('manifest');
        fetch('/manifest.json')
            .then(r => r.json())
            .then(data => {
                addItem(manifestEl, '加载状态', '✓ 成功', 'success');
                addItem(manifestEl, '应用名称', data.name);
                addItem(manifestEl, 'Start URL', data.start_url);
                addItem(manifestEl, 'Display', data.display);
                addItem(manifestEl, '图标数量', data.icons.length + ' 个');
                log('Manifest 加载成功');
            })
            .catch(e => {
                addItem(manifestEl, '加载状态', '✗ 失败', 'error');
                addItem(manifestEl, '错误', e.message, 'error');
                log('Manifest 加载失败: ' + e.message, 'error');
            });

        // PWA 安装检测
        const installEl = document.getElementById('install');
        const installBtn = document.getElementById('installBtn');
        let deferredPrompt;

        window.addEventListener('beforeinstallprompt', (e) => {
            e.preventDefault();
            deferredPrompt = e;
            addItem(installEl, '安装提示', '✓ 已触发', 'success');
            installBtn.style.display = 'block';
            log('beforeinstallprompt 事件已触发');
        });

        window.addEventListener('appinstalled', () => {
            addItem(installEl, '安装状态', '✓ 已安装', 'success');
            log('PWA 已安装');
        });

        installBtn.addEventListener('click', async () => {
            if (!deferredPrompt) {
                alert('安装提示未准备好');
                return;
            }
            
            deferredPrompt.prompt();
            const { outcome } = await deferredPrompt.userChoice;
            log('用户选择: ' + outcome);
            
            if (outcome === 'accepted') {
                addItem(installEl, '用户操作', '✓ 同意安装', 'success');
            } else {
                addItem(installEl, '用户操作', '✗ 取消安装', 'warning');
            }
            
            deferredPrompt = null;
            installBtn.style.display = 'none';
        });

        // 检查是否已安装
        if (window.matchMedia('(display-mode: standalone)').matches) {
            addItem(installEl, '安装状态', '✓ 已安装', 'success');
            log('PWA 已安装（standalone 模式）');
        } else {
            addItem(installEl, '安装状态', '✗ 未安装', 'warning');
            log('PWA 未安装');
        }

        // 初始日志
        log('PWA 诊断工具启动');
        log('当前 URL: ' + window.location.href);
    </script>
</body>
</html>
